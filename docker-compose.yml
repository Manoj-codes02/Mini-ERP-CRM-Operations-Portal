version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: erp_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: erp_crm_db
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./erp-crm-backend
    container_name: erp_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql-db
      DB_USER: erp_user
      DB_PASSWORD: erp_password
      DB_NAME: erp_crm_db
      DB_PORT: 3306
      JWT_SECRET: supersecret_erp_jwt_key_2026
    depends_on:
      - mysql-db

  frontend:
    build: ./erp-crm-frontend
    container_name: erp_frontend_ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
